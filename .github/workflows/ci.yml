name: Continuous integration

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build

  backend:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: zhaoniu_ci
          POSTGRES_USER: zhaoniu
          POSTGRES_PASSWORD: zhaoniu-ci-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U zhaoniu -d zhaoniu_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7.4-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 3s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+asyncpg://zhaoniu:zhaoniu-ci-password@127.0.0.1:5432/zhaoniu_ci
      TEST_DATABASE_URL: postgresql+asyncpg://zhaoniu:zhaoniu-ci-password@127.0.0.1:5432/zhaoniu_test
      REDIS_URL: redis://127.0.0.1:6379/0
      CELERY_BROKER_URL: redis://127.0.0.1:6379/1
      CELERY_RESULT_BACKEND: redis://127.0.0.1:6379/2
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          python-version: "3.12"
          enable-cache: true
      - run: uv sync --frozen --all-groups
      - name: Create isolated integration database safely
        run: |
          uv run python - <<'PY'
          import asyncio
          import asyncpg

          async def main() -> None:
              connection = await asyncpg.connect(
                  "postgresql://zhaoniu:zhaoniu-ci-password@127.0.0.1:5432/zhaoniu_ci"
              )
              try:
                  await connection.execute("CREATE DATABASE zhaoniu_test")
              finally:
                  await connection.close()

          asyncio.run(main())
          PY
      - run: uv run ruff check .
      - run: uv run mypy apps/api/src apps/worker/src
      - run: uv run alembic -c infrastructure/migrations/alembic.ini upgrade head
      - run: uv run alembic -c infrastructure/migrations/alembic.ini check
      - name: Migrate isolated integration database
        env:
          DATABASE_URL: ${{ env.TEST_DATABASE_URL }}
        run: uv run alembic -c infrastructure/migrations/alembic.ini upgrade head
      - run: uv run pytest
      - name: Validate production Compose
        env:
          PRODUCTION_ENV_FILE: ${{ github.workspace }}/.env.production.example
        run: >-
          docker compose --env-file .env.production.example
          -f infrastructure/production/docker-compose.yml config --quiet

  api-contract:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          python-version: "3.12"
          enable-cache: true
      - run: pnpm install --frozen-lockfile
      - run: uv sync --frozen --all-groups
      - run: pnpm api:check

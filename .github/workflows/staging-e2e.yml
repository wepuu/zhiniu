name: Staging browser acceptance

on:
  workflow_run:
    workflows: ["Build and deploy staging"]
    branches: [main]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: zhaoniu-staging-e2e
  cancel-in-progress: true

jobs:
  chromium:
    if: >-
      vars.STAGING_DEPLOY_ENABLED == 'true' &&
      (github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-24.04
    env:
      E2E_BASE_URL: https://app.zhiniu.cc
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.workflow_run.head_sha || 'main' }}
          persist-credentials: false
      - uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @zhaoniu/web exec playwright install --with-deps chromium
      - run: pnpm e2e
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: staging-playwright-report
          path: |
            apps/web/playwright-report
            apps/web/test-results
          if-no-files-found: ignore
          retention-days: 14

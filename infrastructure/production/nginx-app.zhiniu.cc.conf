# Install through the BT panel as the app.zhiniu.cc site configuration.
# BT is the only certificate owner; do not run a second Certbot renewal path.
server {
    listen 80;
    listen [::]:80;
    server_name app.zhiniu.cc;

    location ^~ /.well-known/acme-challenge/ {
        root /www/wwwroot/app.zhiniu.cc;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name app.zhiniu.cc;

    # BT writes the exact certificate paths when Let's Encrypt is enabled.
    ssl_certificate /www/server/panel/vhost/cert/app.zhiniu.cc/fullchain.pem;
    ssl_certificate_key /www/server/panel/vhost/cert/app.zhiniu.cc/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    client_max_body_size 2m;
    add_header Strict-Transport-Security "max-age=86400" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Robots-Tag "noindex, nofollow" always;
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data: https:; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline'; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;

    location /api/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 60s;
    }

    location = /livez {
        proxy_pass http://127.0.0.1:8000/livez;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /readyz {
        # Public in staging because administrator source IPs are not stable.
        # The response contains dependency health only and no credentials.
        proxy_pass http://127.0.0.1:8000/readyz;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 60s;
    }
}

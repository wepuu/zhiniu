name: ${COMPOSE_PROJECT_NAME:-zhaoniu-staging}

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

x-api-runtime: &api-runtime
  image: ${API_IMAGE:?set API_IMAGE to an immutable ghcr.io/wepuu/zhiniu-api digest}
  env_file: ${PRODUCTION_ENV_FILE:-../../.env.production}
  logging: *default-logging

services:
  postgres:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?set POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
    command:
      - postgres
      - -c
      - shared_buffers=256MB
      - -c
      - max_connections=30
      - -c
      - work_mem=4MB
      - -c
      - maintenance_work_mem=64MB
    volumes:
      - postgres_data:/var/lib/postgresql/data
    mem_limit: 1280m
    cpus: 1.0
    logging: *default-logging
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7.4-alpine
    restart: unless-stopped
    command:
      [
        "redis-server",
        "--appendonly",
        "yes",
        "--maxmemory",
        "256mb",
        "--maxmemory-policy",
        "noeviction",
      ]
    volumes:
      - redis_data:/data
    mem_limit: 384m
    cpus: 0.25
    logging: *default-logging
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 10

  migrate:
    <<: *api-runtime
    profiles: ["tools"]
    command:
      [
        "alembic",
        "-c",
        "infrastructure/migrations/alembic.ini",
        "upgrade",
        "head",
      ]
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  api:
    <<: *api-runtime
    restart: unless-stopped
    ports:
      - "127.0.0.1:${API_HOST_PORT:-8000}:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    mem_limit: 768m
    cpus: 0.75
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/readyz', timeout=3)",
        ]
      interval: 15s
      timeout: 5s
      retries: 10

  worker:
    <<: *api-runtime
    restart: unless-stopped
    environment:
      ZHAONIU_DISABLE_DB_POOL: "1"
    command:
      [
        "celery",
        "-A",
        "zhaoniu_worker.celery_app:celery_app",
        "worker",
        "--workdir",
        "apps/worker/src",
        "--loglevel",
        "INFO",
        "--concurrency",
        "1",
        "--max-tasks-per-child",
        "50",
      ]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    mem_limit: 1536m
    cpus: 1.0

  beat:
    <<: *api-runtime
    restart: unless-stopped
    environment:
      ZHAONIU_DISABLE_DB_POOL: "1"
    command:
      [
        "celery",
        "-A",
        "zhaoniu_worker.celery_app:celery_app",
        "beat",
        "--workdir",
        "apps/worker/src",
        "--loglevel",
        "INFO",
        "--pidfile",
        "/tmp/zhaoniu-beat.pid",
      ]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    mem_limit: 256m
    cpus: 0.25

  web:
    image: ${WEB_IMAGE:?set WEB_IMAGE to an immutable ghcr.io/wepuu/zhiniu-web digest}
    restart: unless-stopped
    environment:
      API_BASE_URL: http://api:8000
      NODE_OPTIONS: --max-old-space-size=512
    ports:
      - "127.0.0.1:${WEB_HOST_PORT:-3000}:3000"
    depends_on:
      api:
        condition: service_healthy
    mem_limit: 768m
    cpus: 0.5
    logging: *default-logging
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))",
        ]
      interval: 15s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
    name: ${POSTGRES_VOLUME_NAME:-zhaoniu_staging_postgres_data}
  redis_data:
    name: ${REDIS_VOLUME_NAME:-zhaoniu_staging_redis_data}
